[package]
name = "aoc-rust-runner"
version = "0.1.0"
edition = "2021"

[dependencies]
aoc-common = { path = "../common" }
aoc-rust-2015 = { path = "../2015" }
aoc-rust-2018 = { path = "../2018" }
aoc-rust-2019 = { path = "../2019" }
aoc-rust-2020 = { path = "../2020" }
aoc-rust-2021 = { path = "../2021" }
aoc-rust-2022 = { path = "../2022" }
aoc-rust-2023 = { path = "../2023" }
aoc-rust-2025 = { path = "../2025" }
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(advent_of_code_ci)'] }
